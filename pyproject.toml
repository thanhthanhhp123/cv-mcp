[project]
name = "shelf-auditor-mcp"
version = "0.1.0"
description = "MCP server for retail-shelf photo analysis: count products, find gaps, read price tags, check planograms."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "thanh", email = "thanhmaxdz2003@gmail.com" }]
dependencies = [
    "mcp>=1.2,<2",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "ultralytics>=8.1",
    "pillow>=10.2",
    "opencv-python-headless>=4.9",
    "numpy>=1.26",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.3",
    "mypy>=1.9",
]
# Price-tag OCR backend (read_price_tags). Optional — heavy (pulls a second model).
ocr = [
    "python-doctr[torch]>=0.8",
]

[project.scripts]
vision-mcp = "vision_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vision_mcp"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
packages = ["vision_mcp"]
mypy_path = "src"
ignore_missing_imports = true
warn_unused_ignores = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
